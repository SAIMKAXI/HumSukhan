name: humsukhan
description: "HumSukhan - Accessibility-first AI communication and professional listening assistant"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.13.1

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  provider: ^6.1.5+1
  shared_preferences: ^2.5.5
  path_provider: ^2.1.6
  uuid: ^4.6.0
  intl: ^0.19.0
  permission_handler: ^12.0.3
  flutter_tts: ^4.2.5
  speech_to_text: ^7.4.0
  vibration: ^3.2.0
  share_plus: ^10.1.4
  http: ^1.2.2
  sherpa_onnx: ^1.13.6
  web_socket_channel: ^3.0.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/logo.png
