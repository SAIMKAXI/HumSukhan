name: humsukhan
description: "HumSukhan - Accessibility-first AI communication and professional listening assistant"
publish_to: 'none'
version: 2.4.5+35

# Release v2.4.5
# Reliability: native Android environmental PCM capture and microphone ownership hardening.

environment:
  sdk: '>=3.8.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8
  provider: ^6.1.5+1
  shared_preferences: ^2.5.5
  path_provider: ^2.1.6
  uuid: ^4.6.0
  intl: ^0.20.3
  permission_handler: ^13.0.1
  flutter_tts: ^4.2.5
  speech_to_text: ^7.4.0
  vibration: ^3.2.0
  share_plus: ^10.1.4
  sherpa_onnx: ^1.13.6
  supabase_flutter: ^2.8.0
  http: ^1.2.0
  record: ^5.1.0
  audioplayers: ^6.8.1
  flutter_local_notifications: ^20.1.0
  image_picker: ^1.2.3

dependency_overrides:
  # record 5.2.1 can resolve record_platform_interface newer than its bundled
  # record_linux 0.7.2, which fails kernel compilation. Use the compatible
  # maintained Linux implementation without changing the app's record API.
  record_linux: 1.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  # Used directly by test/speech_capability_recheck_test.dart to fake the
  # native speech recognizer platform without touching a real method channel.
  plugin_platform_interface: ^2.1.8
  speech_to_text_platform_interface: ^2.4.0

flutter:
  uses-material-design: true
  assets:
    - assets/logo.png
    - assets/icon_mark.png
    - assets/logo_rectangle.png
    - assets/logo_rectangle_transparent.png
    - assets/environmental/model.int8.onnx
    - assets/environmental/class_labels_indices.csv
  fonts:
    - family: NotoNastaliqUrdu
      fonts:
        - asset: fonts/noto_sans/NotoNastaliqUrdu-Regular.ttf
