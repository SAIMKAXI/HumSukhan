name: humsukhan
description: "HumSukhan - Accessibility-first AI communication and professional listening assistant"
publish_to: 'none'
version: 2.3.3+22

environment:
  sdk: '>=3.8.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8
  provider: ^6.1.2
  shared_preferences: ^2.5.3
  speech_to_text: ^7.0.0
  flutter_tts: ^4.2.3
  permission_handler: ^12.0.1
  record: ^6.0.0
  audioplayers: ^6.5.0
  path_provider: ^2.1.5
  http: ^1.4.0
  crypto: ^3.0.6
  uuid: ^4.5.1
  connectivity_plus: ^6.1.4
  supabase_flutter: ^2.9.0
  web_socket_channel: ^3.0.3
  intl: ^0.20.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  generate: true
  assets:
    - assets/
    - assets/audio/
