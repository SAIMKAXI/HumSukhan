name: HumSukhan Flutter QA

on:
  pull_request:
    branches: [main]
    paths:
      - 'humsukhan/**'
      - 'supabase/**'
      - '.github/workflows/flutter-qa.yml'
  push:
    branches: [main, 'fix/**']
    paths:
      - 'humsukhan/**'
      - 'supabase/**'
      - '.github/workflows/flutter-qa.yml'

jobs:
  flutter-qa:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: humsukhan
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Prepare bundled environmental model
        run: bash tool/prepare_environmental_model.sh
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.1'
          channel: stable
          cache: true
      - name: Install dependencies
        run: flutter pub get
      - name: Static analysis
        # Warnings/infos are reported but do not block the tested build.
        run: flutter analyze --no-fatal-infos --no-fatal-warnings
      - name: Tests
        run: flutter test
      - name: Android debug build
        # Fail rather than produce an APK that silently disables its backend.
        env:
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY || vars.SUPABASE_ANON_KEY }}
        run: |
          if [ -z "$SUPABASE_ANON_KEY" ]; then
            echo "::error::Configure SUPABASE_ANON_KEY as a GitHub Actions secret or repository variable."
            exit 1
          fi
          flutter build apk --debug --dart-define=SUPABASE_ANON_KEY="$SUPABASE_ANON_KEY"
