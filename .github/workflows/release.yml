name: HumSukhan Android Release

on:
  push:
    branches: [main]
    paths:
      - 'humsukhan/pubspec.yaml'
      - 'humsukhan/android/**'
      - 'humsukhan/lib/**'
      - '.github/workflows/release.yml'

permissions:
  contents: write

concurrency:
  group: humsukhan-release
  cancel-in-progress: true

env:
  FLUTTER_VERSION: '3.1.1'
  APP_VERSION: '2.1.1'
  SUPABASE_URL: 'https://dxwlwnzdfdhfpeaeoagj.supabase.co'

jobs:
  android:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: humsukhan
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: Dependencies
        run: flutter pub get
      - name: Validate release configuration
        env:
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: test -n "$SUPABASE_ANON_KEY" || { echo "Missing required GitHub Actions secret: SUPABASE_ANON_KEY"; exit 1; }
      - name: Analyze
        run: flutter analyze --no-fatal-infos
      - name: Test
        run: flutter test
      - name: Build release APK
        env:
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          flutter build apk --release \
            --dart-define=SUPABASE_URL="$SUPABASE_URL" \
            --dart-define=SUPABASE_ANON_KEY="$SUPABASE_ANON_KEY" \
            --dart-define=GEMINI_API_KEY="$GEMINI_API_KEY"
      - name: Rename APK
        run: cp build/app/outputs/flutter-apk/app-release.apk build/app/outputs/flutter-apk/HumSukhan-${{ env.APP_VERSION }}.apk
      - name: Upload APK artifact
        uses: actions/upload-artifact@v5
        with:
          name: HumSukhan-${{ env.APP_VERSION }}-android
          path: humsukhan/build/app/outputs/flutter-apk/HumSukhan-${{ env.APP_VERSION }}.apk
      - name: Create or update GitHub release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: v${{ env.APP_VERSION }}
          name: HumSukhan v${{ env.APP_VERSION }}
          generate_release_notes: true
          files: humsukhan/build/app/outputs/flutter-apk/HumSukhan-${{ env.APP_VERSION }}.apk
