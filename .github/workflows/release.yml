name: HumSukhan Android Release

on:
  push:
    branches: [main]
    paths:
      - 'humsukhan/pubspec.yaml'
      - 'humsukhan/android/**'
      - 'humsukhan/lib/**'
      - '.github/workflows/release.yml'

permissions:
  contents: write

env:
  FLUTTER_VERSION: '3.47.1'
  APP_VERSION: '1.2.0'

jobs:
  android:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: humsukhan
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

      - name: Build release APK
        run: flutter build apk --release

      - name: Rename APK
        run: cp build/app/outputs/flutter-apk/app-release.apk build/app/outputs/flutter-apk/HumSukhan-${{ env.APP_VERSION }}.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v5
        with:
          name: HumSukhan-${{ env.APP_VERSION }}-android
          path: humsukhan/build/app/outputs/flutter-apk/HumSukhan-${{ env.APP_VERSION }}.apk

      - name: Create GitHub release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: v${{ env.APP_VERSION }}
          name: HumSukhan v${{ env.APP_VERSION }}
          generate_release_notes: true
          files: humsukhan/build/app/outputs/flutter-apk/HumSukhan-${{ env.APP_VERSION }}.apk
