name: HumSukhan Android Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release version/tag (for example 2.4.4 or v2.4.4)'
        required: true
        type: string
  push:
    branches:
      - main
    tags:
      - 'v*.*.*'

permissions:
  contents: write

env:
  FLUTTER_VERSION: '3.47.1'
  SUPABASE_URL: 'https://dxwlwnzdfdhfpeaeoagj.supabase.co'

jobs:
  android-release:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      startsWith(github.ref, 'refs/tags/v') ||
      (github.event_name == 'push' && github.ref == 'refs/heads/main' && startsWith(github.event.head_commit.message, 'release:'))
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: humsukhan
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Prepare bundled environmental model
        run: bash tool/prepare_environmental_model.sh

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Static analysis
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Tests
        run: flutter test

      - name: Resolve release tag
        id: release
        shell: bash
        run: |
          if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" ]]; then
            RAW_TAG="${{ inputs.tag }}"
          elif [[ "$GITHUB_REF" == refs/tags/* ]]; then
            RAW_TAG="$GITHUB_REF_NAME"
          elif [[ "$GITHUB_REF" == "refs/heads/main" ]]; then
            FULL_VERSION=$(sed -n 's/^version: *//p' pubspec.yaml | head -1)
            RAW_TAG="${FULL_VERSION%%+*}"
          else
            echo "ERROR: Unsupported release trigger: $GITHUB_REF"
            exit 1
          fi

          RAW_TAG="${RAW_TAG#v}"
          [[ "$RAW_TAG" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || {
            echo "ERROR: Invalid release version/tag: $RAW_TAG"
            exit 1
          }

          TAG="v$RAW_TAG"
          PUBSPEC_VERSION=$(sed -n 's/^version: *//p' pubspec.yaml | head -1 | cut -d+ -f1)
          test -n "$PUBSPEC_VERSION" || { echo 'ERROR: Could not read app version.'; exit 1; }
          test "$PUBSPEC_VERSION" = "$RAW_TAG" || {
            echo "ERROR: release tag $TAG does not match pubspec version $PUBSPEC_VERSION"
            exit 1
          }

          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=$RAW_TAG" >> "$GITHUB_OUTPUT"

      - name: Check Supabase build configuration
        env:
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          test -n "$SUPABASE_ANON_KEY" || { echo 'ERROR: SUPABASE_ANON_KEY secret is missing.'; exit 1; }

      - name: Build release APK
        env:
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          flutter build apk --release \
            --dart-define=SUPABASE_URL="$SUPABASE_URL" \
            --dart-define=SUPABASE_ANON_KEY="$SUPABASE_ANON_KEY"

      - name: Verify APK exists
        run: test -s build/app/outputs/flutter-apk/app-release.apk

      - name: Rename APK
        run: cp build/app/outputs/flutter-apk/app-release.apk build/app/outputs/flutter-apk/HumSukhan-${{ steps.release.outputs.version }}.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: HumSukhan-android-${{ steps.release.outputs.version }}
          path: humsukhan/build/app/outputs/flutter-apk/HumSukhan-${{ steps.release.outputs.version }}.apk
          if-no-files-found: error

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: HumSukhan v${{ steps.release.outputs.version }}
          generate_release_notes: true
          files: humsukhan/build/app/outputs/flutter-apk/HumSukhan-${{ steps.release.outputs.version }}.apk
          fail_on_unmatched_files: true
