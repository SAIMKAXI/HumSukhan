name: HumSukhan Android Release

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'humsukhan/pubspec.yaml'
      - 'humsukhan/lib/**'
      - 'humsukhan/android/**'
      - '.github/workflows/**'

permissions:
  contents: write

env:
  FLUTTER_VERSION: '3.47.1'
  SUPABASE_URL: 'https://dxwlwnzdfdhfpeaeoagj.supabase.co'

jobs:
  android-release:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: humsukhan
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: Install dependencies
        run: flutter pub get
      - name: Static analysis
        run: flutter analyze --no-fatal-infos --no-fatal-warnings
      - name: Tests
        run: flutter test
      - name: Read app version
        id: version
        shell: bash
        run: |
          VERSION=$(sed -n 's/^version: *//p' pubspec.yaml | head -1 | cut -d+ -f1)
          test -n "$VERSION" || { echo 'ERROR: Could not read app version.'; exit 1; }
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
      - name: Check Supabase build configuration
        env:
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          test -n "$SUPABASE_ANON_KEY" || { echo 'ERROR: SUPABASE_ANON_KEY secret is missing.'; exit 1; }
      - name: Build release APK
        env:
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          flutter build apk --release \
            --dart-define=SUPABASE_URL="$SUPABASE_URL" \
            --dart-define=SUPABASE_ANON_KEY="$SUPABASE_ANON_KEY"
      - name: Rename APK
        run: cp build/app/outputs/flutter-apk/app-release.apk build/app/outputs/flutter-apk/HumSukhan-${{ steps.version.outputs.version }}.apk
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: HumSukhan-android-${{ steps.version.outputs.version }}
          path: humsukhan/build/app/outputs/flutter-apk/HumSukhan-${{ steps.version.outputs.version }}.apk
          if-no-files-found: error
      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          name: HumSukhan v${{ steps.version.outputs.version }}
          generate_release_notes: true
          files: humsukhan/build/app/outputs/flutter-apk/HumSukhan-${{ steps.version.outputs.version }}.apk
